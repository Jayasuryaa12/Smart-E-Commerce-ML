services:
  - type: web
    name: smart-ecommerce-ml-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-ecommerce-db
          property: connectionString
      - key: ADMIN_API_KEY
        generateValue: true

databases:
  - name: smart-ecommerce-db
    databaseName: ecommerce_ml
    user: ecommerce_admin
    plan: free
